name: "PC7 UI Overhaul"

on:
  workflow_dispatch:
    inputs:
      source_root:
        description: "Kotlin main source root"
        required: true
        default: "app/src/main/java/com/androcalcio"
      force_overwrite:
        description: "Sovrascrivi file esistenti"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    name: "Genera UI PC Calcio 7"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crea branch
        run: |
          git checkout -B pc7-ui-overhaul

      - name: "ui/components/Pc7RosterTable.kt"
        run: |
          TARGET="${{ inputs.source_root }}/ui/components/Pc7RosterTable.kt"
          if [ -f "$TARGET" ] && [ "${{ inputs.force_overwrite }}" != "true" ]; then
            echo "SKIP: $TARGET esiste"; exit 0
          fi
          mkdir -p "$(dirname "$TARGET")"
          cat > "$TARGET" << 'KOTLIN_EOF'
          package com.androcalcio.ui.components

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          // Colori classici PC Calcio
          val Pc7BlueBg = Color(0xFF2A3A8C)
          val Pc7TableBg = Color(0xFFF0F0F0)
          val Pc7HeaderText = Color(0xFFFFFFFF)
          val Pc7RowText = Color(0xFF000000)
          val Pc7Highlight = Color(0xFFD0D0D0)

          @Composable
          fun Pc7RosterTable(
              players: List<Player>,
              onPlayerClick: (Player) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .border(2.dp, Color.Black)
                      .background(Pc7TableBg)
              ) {
                  // Header
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Pc7BlueBg)
                          .padding(vertical = 4.dp, horizontal = 2.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      TableHeader("N°", 0.05f)
                      TableHeader("GIOCATORE", 0.25f, TextAlign.Start)
                      TableHeader("EN", 0.06f)
                      TableHeader("VE", 0.06f)
                      TableHeader("RE", 0.06f)
                      TableHeader("AG", 0.06f)
                      TableHeader("QU", 0.06f)
                      TableHeader("ME", 0.06f)
                      TableHeader("SF", 0.06f)
                      TableHeader("MO", 0.06f)
                      TableHeader("RUO", 0.12f)
                  }
                  // Rows
                  LazyColumn {
                      items(players) { player ->
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 2.dp, horizontal = 2.dp)
                                  .border(0.5.dp, Color.Gray),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              TableCell(player.maglia.toString(), 0.05f, TextAlign.Center)
                              TableCell(player.shortName, 0.25f, TextAlign.Start, FontWeight.Bold)
                              TableCell(player.att_en.toString(), 0.06f, color = getStatColor(player.att_en))
                              TableCell(player.att_ve.toString(), 0.06f, color = getStatColor(player.att_ve))
                              TableCell(player.att_re.toString(), 0.06f, color = getStatColor(player.att_re))
                              TableCell(player.att_ag.toString(), 0.06f, color = getStatColor(player.att_ag))
                              TableCell(player.att_qu.toString(), 0.06f, color = getStatColor(player.att_qu))
                              TableCell(player.att_me.toString(), 0.06f, color = getStatColor(player.att_me))
                              TableCell(player.att_sf.toString(), 0.06f, color = getStatColor(player.att_sf))
                              TableCell(player.morale.toString(), 0.06f, color = getStatColor(player.morale))
                              TableCell(player.ruolo, 0.12f, color = Color.Blue)
                          }
                      }
                  }
              }
          }

          @Composable
          fun RowScope.TableHeader(text: String, weight: Float, align: TextAlign = TextAlign.Center) {
              Text(
                  text = text,
                  modifier = Modifier.weight(weight),
                  color = Pc7HeaderText,
                  fontSize = 10.sp,
                  fontWeight = FontWeight.Bold,
                  textAlign = align
              )
          }

          @Composable
          fun RowScope.TableCell(
              text: String,
              weight: Float,
              align: TextAlign = TextAlign.Center,
              weightFont: FontWeight = FontWeight.Normal,
              color: Color = Pc7RowText
          ) {
              Text(
                  text = text,
                  modifier = Modifier.weight(weight),
                  color = color,
                  fontSize = 11.sp,
                  fontWeight = weightFont,
                  textAlign = align
              )
          }

          fun getStatColor(stat: Int): Color {
              return when {
                  stat >= 80 -> Color(0xFF008000) // Verde
                  stat >= 60 -> Color(0xFF000000) // Nero
                  stat >= 40 -> Color(0xFFD2691E) // Arancio scuro
                  else -> Color(0xFFB22222) // Rosso
              }
          }
          KOTLIN_EOF

      - name: "ui/components/Pc7PlayerCard.kt"
        run: |
          TARGET="${{ inputs.source_root }}/ui/components/Pc7PlayerCard.kt"
          if [ -f "$TARGET" ] && [ "${{ inputs.force_overwrite }}" != "true" ]; then
            echo "SKIP: $TARGET esiste"; exit 0
          fi
          mkdir -p "$(dirname "$TARGET")"
          cat > "$TARGET" << 'KOTLIN_EOF'
          package com.androcalcio.ui.components

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          @Composable
          fun Pc7PlayerCard(player: Player, onDismiss: () -> Unit) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              modifier = Modifier
                                  .size(40.dp)
                                  .clip(CircleShape)
                                  .background(Color.Blue)
                          )
                          Spacer(Modifier.width(8.dp))
                          Text(text = player.fullName, color = Color.White)
                      }
                  },
                  containerColor = Pc7BlueBg,
                  text = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color.White)
                              .padding(8.dp)
                              .border(1.dp, Color.Gray)
                      ) {
                          Row {
                              // Left Column: Info
                              Column(Modifier.weight(1f)) {
                                  InfoRow("EDAD", "${player.eta} anni")
                                  InfoRow("NACION.", player.nazionalita)
                                  InfoRow("ROL", player.ruolo)
                                  InfoRow("ESTADO", "Nessuno")
                              }
                              // Right Column: Stats
                              Column(Modifier.weight(1f)) {
                                  StatRow("VELOCIDAD", player.att_ve)
                                  StatRow("RESISTENZA", player.att_en)
                                  StatRow("AGGRESSIVITA", player.att_ag)
                                  StatRow("CONTROLLO", player.att_qu)
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                          Divider(color = Color.Gray)
                          Spacer(Modifier.height(8.dp))
                          // Contratto
                          Text("CONTRATTO", fontSize = 10.sp, fontWeight = FontWeight.Bold)
                          Row(modifier = Modifier.padding(top = 4.dp)) {
                              ContractBox("STIPENDIO", "€${player.salario / 1000}k", Modifier.weight(1f))
                              Spacer(Modifier.width(4.dp))
                              ContractBox("ANNI", "${player.contratto}", Modifier.weight(1f))
                          }
                      }
                  },
                  confirmButton = {
                      PcAction("OK", onClick = onDismiss)
                  }
              )
          }

          @Composable
          fun InfoRow(label: String, value: String) {
              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                  Text(label, fontSize = 10.sp, fontWeight = FontWeight.Bold, color = Color.Gray)
                  Text(value, fontSize = 10.sp, color = Color.Black)
              }
          }

          @Composable
          fun StatRow(label: String, value: Int) {
              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                  Text(label, fontSize = 10.sp, fontWeight = FontWeight.Bold, color = Color.Gray)
                  Text(value.toString(), fontSize = 10.sp, color = getStatColor(value), fontWeight = FontWeight.Bold)
              }
          }

          @Composable
          fun ContractBox(label: String, value: String, modifier: Modifier = Modifier) {
              Column(
                  modifier = modifier
                      .background(Pc7BlueBg)
                      .padding(4.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text(label, fontSize = 8.sp, color = Color.White)
                  Text(value, fontSize = 12.sp, color = Color.Yellow, fontWeight = FontWeight.Bold)
              }
          }
          KOTLIN_EOF

      - name: "ui/components/Pc7TournamentGroups.kt"
        run: |
          TARGET="${{ inputs.source_root }}/ui/components/Pc7TournamentGroups.kt"
          if [ -f "$TARGET" ] && [ "${{ inputs.force_overwrite }}" != "true" ]; then
            echo "SKIP: $TARGET esiste"; exit 0
          fi
          mkdir -p "$(dirname "$TARGET")"
          cat > "$TARGET" << 'KOTLIN_EOF'
          package com.androcalcio.ui.components

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          data class Group(val name: String, val teams: List<String>)

          @Composable
          fun Pc7TournamentGroups(groups: List<Group>) {
              LazyVerticalGrid(
                  columns = GridCells.Fixed(4),
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0B1035))
                      .padding(16.dp),
                  contentPadding = PaddingValues(8.dp)
              ) {
                  items(groups) { group ->
                      Column(
                          modifier = Modifier
                              .padding(4.dp)
                              .border(1.dp, Color.White)
                      ) {
                          // Header Girone
                          Text(
                              text = group.name,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(Color.White)
                                  .padding(4.dp),
                              color = Color.Black,
                              fontWeight = FontWeight.Bold,
                              fontSize = 10.sp
                          )
                          // Teams
                          group.teams.forEach { team ->
                              Text(
                                  text = team,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 4.dp, vertical = 6.dp),
                                  color = Color.White,
                                  fontSize = 10.sp
                              )
                          }
                      }
                  }
              }
          }
          KOTLIN_EOF

      - name: "PC7_UI_GUIDE.md"
        run: |
          TARGET="PC7_UI_GUIDE.md"
          if [ -f "$TARGET" ] && [ "${{ inputs.force_overwrite }}" != "true" ]; then
            echo "SKIP: $TARGET esiste"; exit 0
          fi
          cat > "$TARGET" << 'MD_EOF'
          # Guida all'integrazione UI PC Calcio 7

          Questo workflow ha generato 3 nuovi componenti UI in stile PC Calcio 7.
          Per applicarli, sostituisci le schermate attuali con i seguenti componenti.

          ## 1. Tabella Rosa (`Pc7RosterTable.kt`)
          Sostituisci l'attuale `LazyColumn` nella tua `RosaScreen.kt` con:

          ```kotlin
          Pc7RosterTable(
              players = viewModel.squadList,
              onPlayerClick = { player -> viewModel.openPlayerDetails(player) }
          )
          ```
          *Nota: Assicurati che il tuo `Player` model abbia i campi `att_en`, `att_ve`, `att_re`, `att_ag`, `att_qu`, `att_me`, `att_sf` (gli attributi usati nel DB).*

          ## 2. Scheda Giocatore (`Pc7PlayerCard.kt`)
          Quando l'utente clicca su un giocatore, mostra questa scheda modale:

          ```kotlin
          if (showPlayerDialog) {
              Pc7PlayerCard(
                  player = selectedPlayer,
                  onDismiss = { showPlayerDialog = false }
              )
          }
          ```
          *Nota: Sostituisci `player.fullName` nel codice con il campo reale del tuo DB, se si chiama diversamente.*

          ## 3. Gironi Torneo (`Pc7TournamentGroups.kt`)
          Se hai una schermata per la Champions League o i Mondiali, usa:

          ```kotlin
          val groups = listOf(
              Group("GROUP A", listOf("MEXICO", "SOUTH AFRICA", "KOREA", "WINNER PLAY-OFF")),
              Group("GROUP B", listOf("CANADA", "FIFA", "QATAR", "SWITZERLAND"))
              // ecc...
          )

          Pc7TournamentGroups(groups = groups)
          ```

          ## 4. Campo Tattico (`Pc7Pitch.kt`)
          Il campo è già stato aggiornato nel workflow precedente. Ora, nella tua `FormationScreen.kt`, assicurati che il `Pc7Pitch` sia racchiuso in un contenitore con sfondo blu scuro e bordi bianchi, come da foto.
          MD_EOF

      - name: Apri PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: pc7-ui-overhaul
          base: main
          title: "UI Overhaul: Tabella Rosa, Scheda Giocatore e Gironi in stile PC Calcio 7"
          body: |
            ## Cosa contiene questa PR

            File nuovi generati automaticamente in stile PC Calcio 7:

            - `ui/components/Pc7RosterTable.kt` — Tabella classica con colonne EN, VE, RE, AG, QU, ME, SF.
            - `ui/components/Pc7PlayerCard.kt` — Scheda modale con dati giocatore, attributi colorati e contratto.
            - `ui/components/Pc7TournamentGroups.kt` — Griglia per i gironi di coppa/mondiale.
            - `PC7_UI_GUIDE.md` — Istruzioni dettagliate per integrare questi componenti nelle tue schermate esistenti.

            **Applica le modifiche suggerite nella guida per sostituire le vecchie UI.**
          labels: |
            ui
            pc7-restyle
          delete-branch: false
