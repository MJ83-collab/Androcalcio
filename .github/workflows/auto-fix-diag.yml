name: "Auto Fix & Diag"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose_and_fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Diagnostica Struttura Repo
        run: |
          echo "=== 1. FILE YML NELLA RADICE ==="
          ls -la *.yml 2>/dev/null || echo "Nessun .yml nella radice"

          echo "=== 2. WORKFLOW ATTUALI ==="
          ls -la .github/workflows 2>/dev/null || echo "Cartella .github/workflows assente"

          echo "=== 3. FILE MAINACTIVITY / APP TROVATI ==="
          find . -maxdepth 6 \( -name "MainActivity.kt" -o -name "App.kt" \) 2>/dev/null

          echo "=== 4. FILE GRADLE TROVATI ==="
          find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null

      - name: Sposta Workflow Dalla Radice a .github/workflows
        run: |
          mkdir -p .github/workflows
          for f in *.yml; do
            if [ -f "$f" ] && [ "$f" != "auto-fix-diag.yml" ]; then
              echo "Sposto $f -> .github/workflows/$f"
              mv "$f" ".github/workflows/$f"
            fi
          done

      - name: Applica Fix Versione e MainActivity
        run: |
          GRADLE_FILE=$(find app -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            echo "Aggiorno versione in: $GRADLE_FILE"
            sed -i -E 's/(versionCode[[:space:]]*=*[[:space:]]*)[0-9]+/\199/' "$GRADLE_FILE"
            sed -i -E 's/(versionName[[:space:]]*=*[[:space:]]*)"[^"]*"/\1"99.0.0-NUCLEAR"/' "$GRADLE_FILE"
          fi

          MAIN_FILE=$(find app/src/main -type f \( -name "MainActivity.kt" -o -name "App.kt" \) | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            echo "Sovrascrivo: $MAIN_FILE"
            PKG=$(grep -m 1 "^package " "$MAIN_FILE" | sed 's/^package[[:space:]]*//; s/;.*//; s/[[:space:]]*$//')
            cat > "$MAIN_FILE" << EOF
package $PKG

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.background
import androidx.compose.foundation.border
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.rememberScrollState
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.foundation.verticalScroll
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Brush
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            NuclearHomeScreen()
        }
    }
}

@Composable
fun NuclearHomeScreen() {
    val scrollState = rememberScrollState()
    Column(
        modifier = Modifier
            .fillMaxSize()
            .background(Brush.verticalGradient(listOf(Color(0xFF0F111A), Color(0xFF000000))))
            .verticalScroll(scrollState)
            .padding(24.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        Text("VERSIONE NUCLEAR 99.0", color = Color(0xFF00E5FF), fontSize = 14.sp, fontWeight = FontWeight.Bold)

        Row(verticalAlignment = Alignment.CenterVertically) {
            Box(modifier = Modifier.size(64.dp).background(Color(0xFF990000), RoundedCornerShape(32.dp)))
            Spacer(Modifier.width(16.dp))
            Column {
                Text("Milano RN", color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Black)
                Text("Serie A · 2026/27", color = Color(0xFF00E5FF), fontSize = 16.sp)
            }
        }

        Spacer(Modifier.height(24.dp))
        Text("MENU PRINCIPALE", color = Color.Gray, fontSize = 12.sp, fontWeight = FontWeight.Bold)

        Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
            MenuCardNuclear("PARTITA", "Simulazione 2D", Modifier.weight(1f))
            MenuCardNuclear("ROSA", "Gestisci i giocatori", Modifier.weight(1f))
        }
        Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
            MenuCardNuclear("MERCATO", "Trattative", Modifier.weight(1f))
            MenuCardNuclear("TATTICHE", "Moduli", Modifier.weight(1f))
        }
    }
}

@Composable
fun MenuCardNuclear(title: String, subtitle: String, modifier: Modifier = Modifier) {
    Column(
        modifier = modifier
            .background(Color(0xFF1E2233), RoundedCornerShape(16.dp))
            .border(2.dp, Color(0xFF00E5FF).copy(alpha = 0.5f), RoundedCornerShape(16.dp))
            .padding(16.dp)
    ) {
        Text(title, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
        Text(subtitle, color = Color(0xFFA0A5B5), fontSize = 12.sp)
    }
}
EOF
          else
            echo "NON TROVATO MainActivity.kt in app/src/main"
          fi

      - name: Commit e Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto fix: sposta workflow, aggiorna versione e MainActivity"
            git push origin main --force
          else
            echo "Nessuna modifica da committare"
          fi
