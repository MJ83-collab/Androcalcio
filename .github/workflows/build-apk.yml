name: Build APK

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test motore (taratura)
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK (R8)
        run: gradle assembleRelease --no-daemon

      - name: Prova di avvio su emulatore (abilita KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prova di avvio su emulatore (avvio + 1500 tocchi casuali)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash .github/smoke.sh

      - name: Schermate della prova su emulatore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: schermate/*.png
          if-no-files-found: ignore

      - name: Registro della prova (solo se c'è un crash)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prova-avvio-log
          path: smoke-log.txt
          if-no-files-found: ignore

      - name: Prepara un unico file
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p consegna
          cp app/build/outputs/apk/release/*.apk "consegna/Androcalcio-$V.apk"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Upload APK (unico file)
        uses: actions/upload-artifact@v4
        with:
          name: Androcalcio-${{ env.V }}
          path: consegna/*.apk
          if-no-files-found: error
