name: Build APK

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test motore (taratura)
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK (R8)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androcalcio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK ottimizzato
        uses: actions/upload-artifact@v4
        with:
          name: androcalcio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload rose fisse generate
        uses: actions/upload-artifact@v4
        with:
          name: rose-fisse
          path: app/build/rose_fisse.csv
          if-no-files-found: ignore
