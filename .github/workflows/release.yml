name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Versione e release già esistente?
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "esiste=1" >> "$GITHUB_OUTPUT"; else echo "esiste=0" >> "$GITHUB_OUTPUT"; fi
      - name: Test e build
        if: steps.ver.outputs.esiste == '0'
        run: gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon
      - name: Crea la release
        if: steps.ver.outputs.esiste == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "androcalcio-$TAG-debug.apk"
          cp app/build/outputs/apk/release/*.apk "androcalcio-$TAG-ottimizzato.apk"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Androcalcio $TAG" \
            --notes "Mutui bancari, risparmio batteria, scheda Analisi, pulizia. Dettagli in report.md. L'APK 'ottimizzato' usa R8 e non è stato provato su telefono: se non parte, usa quello 'debug'." \
            "androcalcio-$TAG-debug.apk" "androcalcio-$TAG-ottimizzato.apk"
