name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test e build
        run: gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon
      - name: Rinomina APK
        run: |
          cp app/build/outputs/apk/debug/*.apk "androcalcio-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "androcalcio-${GITHUB_REF_NAME}-ottimizzato.apk"
      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Androcalcio $GITHUB_REF_NAME" \
            --notes "Mutui bancari, risparmio batteria, scheda Analisi, pulizia. Dettagli in report.md. L'APK 'ottimizzato' usa R8 e non è stato provato su telefono: se non parte, usa quello 'debug'." \
            androcalcio-*-debug.apk androcalcio-*-ottimizzato.apk
