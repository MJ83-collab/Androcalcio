name: 🚀 Build & Auto-Version APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout del codice
      uses: actions/checkout@v4

    - name: ☕ Imposta Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: ⚙️ Installa Gradle (versione del progetto)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.3'
        cache: true

    - name: 🔧 Auto-Incrementa versionCode e versionName
      run: |
        if [ -f "app/build.gradle.kts" ]; then
          FILE_GRADLE="app/build.gradle.kts"
        else
          FILE_GRADLE="app/build.gradle"
        fi
        echo "Aggiorno $FILE_GRADLE con run number ${{ github.run_number }}"
        python3 -c "
        run_number = '${{ github.run_number }}'
        file_path = '$FILE_GRADLE'
        with open(file_path, 'r', encoding='utf-8') as f:
            lines = f.readlines()
        with open(file_path, 'w', encoding='utf-8') as f:
            for line in lines:
                if 'versionCode' in line and '=' in line:
                    p = line.split('=')
                    f.write(p[0] + '= ' + run_number + '\n')
                elif 'versionName' in line and '=' in line:
                    p = line.split('=')
                    f.write(p[0] + '= \"1.0.' + run_number + '\"\n')
                else:
                    f.write(line)
        "
        echo "✅ Ora il file contiene:"
        grep -E "versionCode|versionName" "$FILE_GRADLE" || true

    - name: 🏗️ Compila l'APK (Debug)
      run: gradle assembleDebug

    - name: 📦 Carica l'APK come Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Androcalcio-v1.0-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
