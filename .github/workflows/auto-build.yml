name: 🚀 Build & Auto-Version APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permette di avviarlo manualmente con un clic

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout del codice
      uses: actions/checkout@v4

    - name: ☕ Imposta Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Auto-Incrementa versionCode e versionName
      run: |
        # Cerca se esiste build.gradle.kts (Kotlin) o build.gradle (Groovy)
        if [ -f "app/build.gradle.kts" ]; then
          FILE_GRADLE="app/build.gradle.kts"
        else
          FILE_GRADLE="app/build.gradle"
        fi
        
        echo "Aggiornamento di $FILE_GRADLE con la run number: ${{ github.run_number }}"
        
        # Script Python sicuro per sostituire solo le righe di versionCode e versionName
        python3 -c "
        import os
        run_number = '${{ github.run_number }}'
        file_path = '$FILE_GRADLE'
        
        with open(file_path, 'r', encoding='utf-8') as f:
            lines = f.readlines()
            
        with open(file_path, 'w', encoding='utf-8') as f:
            for line in lines:
                if 'versionCode' in line and '=' in line:
                    parts = line.split('=')
                    f.write(parts[0] + '= ' + run_number + '\n')
                elif 'versionName' in line and '=' in line:
                    parts = line.split('=')
                    f.write(parts[0] + '= \"1.0.' + run_number + '\"\n')
                else:
                    f.write(line)
        "
        
        echo "✅ File aggiornato. Anteprima delle righe modificate:"
        grep -E "versionCode|versionName" "$FILE_GRADLE" || true

    - name: 🛠️ Concedi permessi di esecuzione a Gradle
      run: chmod +x ./gradlew

    - name: 🏗️ Compila l'APK (Debug)
      run: ./gradlew assembleDebug

    - name: 📦 Carica l'APK come Artifact scaricabile
      uses: actions/upload-artifact@v4
      with:
        name: Androcalcio-v1.0-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
