name: Fix Build Warnings

on:
  workflow_dispatch:
    inputs:
      agp_version:
        description: "Versione AGP da impostare"
        required: false
        default: "8.7.3"

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run fix script
        run: |
          chmod +x scripts/fix_build_warnings.sh
          ./scripts/fix_build_warnings.sh "${{ inputs.agp_version }}"

      - name: Create Pull Request with fixes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: fix/build-warnings
          delete-branch: true
          title: "Fix build warnings (AutoMirrored icon, AGP, setup-java@v5)"
          commit-message: "chore: fix build warnings"
          body: "Applicato script automatico per aggiornare `Icons.AutoMirrored.Filled.List`, versione AGP e `actions/setup-java@v5`."
