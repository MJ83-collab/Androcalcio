#!/usr/bin/env bash
set -euo pipefail

AGP_VERSION="${1:-8.7.3}"

echo "=== 1. Fix Icons.Filled.List -> Icons.AutoMirrored.Filled.List ==="
TARGET_FILE="app/src/main/java/it/androcalcio/ui/AndrocalcioApp.kt"
if [ -f "$TARGET_FILE" ]; then
  python3 - "$TARGET_FILE" <<'PY'
from pathlib import Path
import re

path = Path("app/src/main/java/it/androcalcio/ui/AndrocalcioApp.kt")
text = path.read_text(encoding="utf-8")

# Sostituisce l'uso dell'icona
text = text.replace("Icons.Filled.List", "Icons.AutoMirrored.Filled.List")

# Aggiorna o aggiunge l'import AutoMirrored
old_import = "import androidx.compose.material.icons.filled.List"
new_import = "import androidx.compose.material.icons.automirrored.filled.List"

if old_import in text:
    text = text.replace(old_import, new_import)
elif new_import not in text and "Icons.AutoMirrored.Filled.List" in text:
    # Inserisce l'import dopo gli altri import androidx.compose.material.icons
    lines = text.splitlines()
    inserted = False
    for i, line in enumerate(lines):
        if line.startswith("import androidx.compose.material.icons."):
            lines.insert(i + 1, new_import)
            inserted = True
            break
    if not inserted:
        for i, line in enumerate(lines):
            if line.startswith("import "):
                lines.insert(i, new_import)
                inserted = True
                break
    text = "\n".join(lines) + ("\n" if text.endswith("\n") else "")

path.write_text(text, encoding="utf-8")
print(f"Aggiornato: {path}")
PY
else
  echo "File non trovato: $TARGET_FILE"
fi

echo "=== 2. Aggiorna versione AGP a ${AGP_VERSION} ==="
if [ -f "gradle/libs.versions.toml" ]; then
  python3 - "$AGP_VERSION" <<'PY'
from pathlib import Path
import re, sys

agp_ver = sys.argv[1]
path = Path("gradle/libs.versions.toml")
text = path.read_text(encoding="utf-8")
updated, count = re.subn(
    r'^(\s*agp\s*=\s*["\'])([^"\']+)(["\'])',
    rf'\g<1>{agp_ver}\g<3>',
    text,
    flags=re.MULTILINE,
)
path.write_text(updated, encoding="utf-8")
print(f"Aggiornato gradle/libs.versions.toml ({count} occorrenze di agp -> {agp_ver})")
PY
fi

# Aggiorna anche build.gradle / build.gradle.kts se la versione AGP è definita lì
for gf in "build.gradle.kts" "build.gradle"; do
  if [ -f "$gf" ]; then
    python3 - "$gf" "$AGP_VERSION" <<'PY'
from pathlib import Path
import re, sys

path = Path(sys.argv[1])
agp_ver = sys.argv[2]
text = path.read_text(encoding="utf-8")
updated, count = re.subn(
    r'(com\.android\.application["\']\s*version\s*["\'])([^"\']+)(["\'])',
    rf'\g<1>{agp_ver}\g<3>',
    text,
)
if count:
    path.write_text(updated, encoding="utf-8")
    print(f"Aggiornato {path} ({count} occorrenze -> {agp_ver})")
PY
  fi
done

echo "=== 3. Aggiorna actions/setup-java@v4 -> actions/setup-java@v5 nei workflow ==="
if [ -d ".github/workflows" ]; then
  python3 - <<'PY'
from pathlib import Path
import re

for wf in Path(".github/workflows").rglob("*.yml"):
    text = wf.read_text(encoding="utf-8")
    updated, count = re.subn(r'actions/setup-java@v4\b', 'actions/setup-java@v5', text)
    if count:
        wf.write_text(updated, encoding="utf-8")
        print(f"Aggiornato {wf} ({count} occorrenze -> @v5)")

for wf in Path(".github/workflows").rglob("*.yaml"):
    text = wf.read_text(encoding="utf-8")
    updated, count = re.subn(r'actions/setup-java@v4\b', 'actions/setup-java@v5', text)
    if count:
        wf.write_text(updated, encoding="utf-8")
        print(f"Aggiornato {wf} ({count} occorrenze -> @v5)")
PY
fi

echo "=== Completato ==="
